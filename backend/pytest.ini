[pytest]

# Point pytest at the project settings module so it can reach the database.
DJANGO_SETTINGS_MODULE = marketlink_core.settings

# File patterns pytest collects as tests.
python_files = tests.py test_*.py *_tests.py

# Silence noisy warnings, skip migrations for speed, and emit a coverage report.
addopts = -p no:warnings --nomigrations --cov=. --cov-report=html

python_classes = Test*
python_functions = test_*
