[pytest]

# pytest-django needs the settings module to reach the database.
DJANGO_SETTINGS_MODULE = marketlink_core.settings

# Migrations run for the test database on purpose: they carry the seeded roles
# (accounts.0002_seed_initial_roles) that almost every fixture depends on.
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

addopts = -p no:warnings
